<!doctype html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="INVENTARIO: control de existencias de bodega. Entradas, salidas, alertas y reportes en un solo libro."
    />
    <meta name="theme-color" content="#890000" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23890000'/%3E%3Cpath d='M7 12.5L16 8l9 4.5V25l-9 4-9-4V12.5Z' fill='none' stroke='%23FFF4ED' stroke-width='1.4' stroke-linejoin='round'/%3E%3Cpath d='M7 12.5L16 17l9-4.5M16 17v12' fill='none' stroke='%23FFF4ED' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>INVENTARIO — Control de bodega</title>
    <script>
      ;(() => {
        try {
          const key = 'inventario-theme'
          let stored = localStorage.getItem(key)
          if (stored !== 'light' && stored !== 'dark') {
            const legacy = Object.keys(localStorage).find(
              (name) => name !== key && name.endsWith('-theme'),
            )
            const previous = legacy ? localStorage.getItem(legacy) : null
            if (previous === 'light' || previous === 'dark') {
              localStorage.setItem(key, previous)
              localStorage.removeItem(legacy)
              stored = previous
            }
          }
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme)
          document.documentElement.style.background =
            theme === 'dark' ? '#1A0807' : '#FFF4ED'
        } catch {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
