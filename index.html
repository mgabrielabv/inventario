<!doctype html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="__BRAND_DESCRIPTION__"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__BRAND_NAME__ — __BRAND_TAGLINE__" />
    <meta property="og:description" content="__BRAND_DESCRIPTION__" />
    <meta property="og:site_name" content="__BRAND_NAME__" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="__BRAND_THEME_LIGHT__" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="__BRAND_THEME_DARK__" />
    <title>__BRAND_NAME__ — __BRAND_TAGLINE__</title>
    <script>
      ;(() => {
        try {
          const key = '__BRAND_THEME_KEY__'
          let stored = localStorage.getItem(key)
          if (stored !== 'light' && stored !== 'dark') {
            const legacy = Object.keys(localStorage).find(
              (name) => name !== key && name.endsWith('-theme'),
            )
            const previous = legacy ? localStorage.getItem(legacy) : null
            if (previous === 'light' || previous === 'dark') {
              localStorage.setItem(key, previous)
              localStorage.removeItem(legacy)
              stored = previous
            }
          }
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme)

          // Los colores viven solo en tokens.css; el monograma se deriva de BRAND.
          const paintChrome = () => {
            const styles = getComputedStyle(document.documentElement)
            const token = (name) => styles.getPropertyValue(name).trim()
            const primary = token('--primary').replace('#', '%23')
            const cream = token('--cream').replace('#', '%23')
            const svg =
              "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>" +
              "<rect width='32' height='32' rx='8' fill='" + cream + "'/>" +
              "<path fill='" + primary + "' d='M10.5 7.5h11v3.4h-3.7v10.2h3.7v3.4h-11v-3.4h3.7V10.9h-3.7z'/></svg>"
            let link = document.querySelector("link[rel='icon']")
            if (!link) {
              link = document.createElement('link')
              link.rel = 'icon'
              document.head.appendChild(link)
            }
            link.href = 'data:image/svg+xml,' + encodeURIComponent(svg)
            const meta = document.querySelector("meta[name='theme-color']")
            if (meta) meta.content = token('--primary')
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', paintChrome, { once: true })
          } else {
            paintChrome()
          }
        } catch {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
