<!doctype html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="INVENTARIO: tienda y control de existencias. Explora el catálogo, haz tu pedido y recibe o retira en tienda."
    />
    <meta name="theme-color" content="#890000" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23890000'/%3E%3Cpath d='M6 12L16 7l10 5v13l-10 5-10-5V12Z' fill='none' stroke='%23FFF4ED' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M6 12l10 5 10-5M16 17v13' fill='none' stroke='%23FFF4ED' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>INVENTARIO — Disponible hoy</title>
    <script>
      ;(() => {
        try {
          const key = 'inventario-theme'
          let stored = localStorage.getItem(key)
          if (stored !== 'light' && stored !== 'dark') {
            const legacy = Object.keys(localStorage).find(
              (name) => name !== key && name.endsWith('-theme'),
            )
            const previous = legacy ? localStorage.getItem(legacy) : null
            if (previous === 'light' || previous === 'dark') {
              localStorage.setItem(key, previous)
              localStorage.removeItem(legacy)
              stored = previous
            }
          }
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme)
          document.documentElement.style.background =
            theme === 'dark' ? '#140606' : '#FFF4ED'
        } catch {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
